<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Group • UniCamplink</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <style>
        :root {
            --razor-primary: #38bdf8;
            --razor-primary-dark: #0ea5e9;
            --razor-bg: #07111f;
            --razor-card: rgba(15, 23, 42, 0.88);
            --razor-card-2: rgba(30, 41, 59, 0.72);
            --razor-border: rgba(148, 163, 184, 0.16);
            --razor-text: #f8fafc;
            --razor-muted: #94a3b8;
            --razor-input: rgba(15, 23, 42, 0.9);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            color: var(--razor-text);
            background:
                radial-gradient(
                    circle at 20% 10%,
                    rgba(56, 189, 248, 0.12),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(14, 165, 233, 0.08),
                    transparent 30%
                ),
                var(--razor-bg);
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;

            min-height: 68px;
            width: 100%;

            display: flex;
            align-items: center;
            gap: 18px;

            padding: 10px 22px;

            background: rgba(7, 17, 31, 0.88);
            border-bottom: 1px solid var(--razor-border);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .logo {
            flex: 0 0 auto;

            display: flex;
            align-items: center;
            gap: 10px;

            color: white;
            text-decoration: none;
            font-weight: 800;
            font-size: 19px;

            white-space: nowrap;
        }

        .logo img {
            width: 40px;
            height: 40px;

            object-fit: contain;
            border-radius: 12px;

            box-shadow:
                0 0 0 1px rgba(56, 189, 248, 0.18),
                0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .nav-links {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;

            overflow-x: auto;
            scrollbar-width: none;
        }

        .nav-links::-webkit-scrollbar {
            display: none;
        }

        .nav-links a {
            flex: 0 0 auto;

            padding: 9px 13px;

            border-radius: 10px;

            color: #cbd5e1;
            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .nav-links a:hover {
            color: white;
            background: rgba(56, 189, 248, 0.1);
        }

        .nav-links a:active {
            transform: scale(0.97);
        }

        /* =========================
           PAGE
        ========================= */

        .create-group-container {
            width: 100%;
            min-height: calc(100vh - 68px);

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding: 55px 20px 80px;
        }

        .create-group-card {
            width: min(100%, 650px);

            padding: 34px;

            background:
                linear-gradient(
                    145deg,
                    rgba(15, 23, 42, 0.96),
                    rgba(15, 23, 42, 0.78)
                );

            border: 1px solid var(--razor-border);
            border-radius: 24px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.32),
                0 0 50px rgba(56, 189, 248, 0.035);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .group-icon {
            width: 58px;
            height: 58px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 20px;

            border-radius: 17px;

            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.18);

            font-size: 28px;

            box-shadow:
                0 10px 30px rgba(14, 165, 233, 0.08);
        }

        .create-group-card h1 {
            margin: 0 0 10px;

            font-size: clamp(25px, 4vw, 34px);
            line-height: 1.15;
            letter-spacing: -0.7px;

            color: #f8fafc;
        }

        .create-group-card > p {
            margin: 0 0 30px;

            color: var(--razor-muted);

            font-size: 15px;
            line-height: 1.7;
        }

        /* =========================
           FORM
        ========================= */

        .group-form {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .group-form label {
            margin-top: 8px;

            color: #e2e8f0;

            font-size: 14px;
            font-weight: 700;
        }

        .group-form input,
        .group-form textarea {
            width: 100%;

            border: 1px solid rgba(148, 163, 184, 0.18);
            outline: none;

            background: var(--razor-input);
            color: #f8fafc;

            border-radius: 14px;

            padding: 14px 15px;

            font-family: inherit;
            font-size: 15px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .group-form input {
            min-height: 50px;
        }

        .group-form textarea {
            min-height: 145px;

            resize: vertical;
            line-height: 1.55;
        }

        .group-form input::placeholder,
        .group-form textarea::placeholder {
            color: #64748b;
        }

        .group-form input:focus,
        .group-form textarea:focus {
            border-color: rgba(56, 189, 248, 0.75);

            background: rgba(15, 23, 42, 0.98);

            box-shadow:
                0 0 0 3px rgba(56, 189, 248, 0.1),
                0 8px 25px rgba(0, 0, 0, 0.12);
        }

        /* =========================
           BUTTON
        ========================= */

        .create-group-button {
            width: 100%;

            min-height: 52px;

            margin-top: 17px;

            border: 0;
            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    var(--razor-primary),
                    var(--razor-primary-dark)
                );

            color: #03111d;

            font-family: inherit;
            font-size: 15px;
            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 12px 28px rgba(14, 165, 233, 0.18);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;
        }

        .create-group-button:hover {
            transform: translateY(-2px);

            filter: brightness(1.05);

            box-shadow:
                0 16px 35px rgba(14, 165, 233, 0.25);
        }

        .create-group-button:active {
            transform: translateY(0) scale(0.99);
        }

        /* =========================
           FOOTER HINT
        ========================= */

        .group-hint {
            margin-top: 20px;

            padding: 13px 15px;

            border-radius: 13px;

            background: rgba(56, 189, 248, 0.055);
            border: 1px solid rgba(56, 189, 248, 0.1);

            color: #94a3b8;

            font-size: 13px;
            line-height: 1.55;
        }

        .group-hint strong {
            color: #bae6fd;
        }

        /* =========================
           LIGHT MODE
        ========================= */

        body.light-mode {
            --razor-bg: #f1f5f9;
            --razor-card: #ffffff;
            --razor-card-2: #f8fafc;
            --razor-border: rgba(15, 23, 42, 0.1);
            --razor-text: #0f172a;
            --razor-muted: #64748b;
            --razor-input: #ffffff;

            background:
                radial-gradient(
                    circle at 20% 10%,
                    rgba(56, 189, 248, 0.12),
                    transparent 32%
                ),
                #f1f5f9;
        }

        body.light-mode .navbar {
            background: rgba(255, 255, 255, 0.9);
        }

        body.light-mode .logo {
            color: #0f172a;
        }

        body.light-mode .nav-links a {
            color: #475569;
        }

        body.light-mode .nav-links a:hover {
            color: #0284c7;
            background: rgba(56, 189, 248, 0.1);
        }

        body.light-mode .create-group-card {
            background: rgba(255, 255, 255, 0.92);

            box-shadow:
                0 25px 70px rgba(15, 23, 42, 0.1);
        }

        body.light-mode .create-group-card h1 {
            color: #0f172a;
        }

        body.light-mode .group-form label {
            color: #334155;
        }

        body.light-mode .group-form input,
        body.light-mode .group-form textarea {
            color: #0f172a;
            background: #ffffff;
            border-color: rgba(15, 23, 42, 0.12);
        }

        body.light-mode .group-form input:focus,
        body.light-mode .group-form textarea:focus {
            background: #ffffff;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .navbar {
                padding: 9px 12px;
                gap: 10px;
            }

            .logo {
                gap: 8px;
                font-size: 16px;
            }

            .logo img {
                width: 36px;
                height: 36px;
            }

            .nav-links {
                justify-content: flex-start;
                gap: 3px;
            }

            .nav-links a {
                padding: 8px 10px;
                font-size: 13px;
            }

            .create-group-container {
                padding:
                    30px
                    14px
                    60px;
            }

            .create-group-card {
                padding: 25px 19px;
                border-radius: 20px;
            }

            .group-icon {
                width: 52px;
                height: 52px;
                font-size: 25px;
            }

            .create-group-card h1 {
                font-size: 26px;
            }

            .create-group-card > p {
                font-size: 14px;
                margin-bottom: 24px;
            }

            .group-form input,
            .group-form textarea {
                font-size: 16px;
            }
        }

        @media (max-width: 430px) {

            .logo span {
                display: none;
            }

            .navbar {
                gap: 8px;
            }

            .nav-links a {
                font-size: 12px;
                padding: 8px 9px;
            }

            .create-group-card {
                padding: 22px 16px;
            }

            .create-group-card h1 {
                font-size: 24px;
            }
        }
    </style>

</head>

<body>

    <!-- =========================
         RAZOR NAVBAR
    ========================== -->

    <nav class="navbar">

        <a href="/dashboard" class="logo">

            <img
                src="{{ url_for('static', filename='images/unicamplink-logo.png') }}"
                alt="UniCamplink Logo"
            >

            <span>UniCamplink</span>

        </a>


        <div class="nav-links">

            <a href="/dashboard">
                🏠 Dashboard
            </a>

            <a href="/groups">
                👥 Groups
            </a>

            <a href="/profile">
                👤 Profile
            </a>

        </div>

    </nav>


    <!-- =========================
         CREATE GROUP
    ========================== -->

    <main class="create-group-container">

        <section class="create-group-card">

            <div class="group-icon">
                👥
            </div>

            <h1>
                Create a Student Group
            </h1>

            <p>
                Bring students together around a shared
                interest, course, campus activity, or community.
            </p>


            <form
                method="POST"
                class="group-form"
            >

                <!-- CSRF Protection -->
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >


                <label for="name">
                    Group Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="e.g. Computer Engineering Students"
                    maxlength="100"
                    autocomplete="off"
                    required
                >


                <label for="description">
                    Group Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Tell students what this group is about..."
                    maxlength="1000"
                    required
                ></textarea>


                <button
                    type="submit"
                    class="create-group-button"
                >
                    Create Group 🚀
                </button>

            </form>


            <div class="group-hint">
                <strong>💡 Tip:</strong>
                Give your group a clear name and description so
                other students can quickly understand what the
                community is about.
            </div>

        </section>

    </main>

</body>

</html>
