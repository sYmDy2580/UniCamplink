<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sell a Product - UniCamplink</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #222;
        }

        /* NAVBAR */
        .navbar {
            background: #1877f2;
            color: white;
            padding: 15px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .back-link {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* CONTAINER */
        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .form-card h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        /* FORM */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #1877f2;
        }

        .hint {
            display: block;
            margin-top: 5px;
            color: #777;
            font-size: 13px;
        }

        /* BUTTON */
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #28a745;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 7px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #218838;
        }

        .cancel-btn {
            display: block;
            width: 100%;
            text-align: center;
            padding: 12px;
            margin-top: 10px;
            background: #eee;
            color: #333;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }

        .cancel-btn:hover {
            background: #ddd;
        }

        /* MOBILE */
        @media (max-width: 600px) {

            .navbar {
                padding: 15px 4%;
            }

            .container {
                width: 94%;
                margin: 25px auto;
            }

            .form-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">

        <div class="logo">
            UniCamplink
        </div>

        <a
            href="{{ url_for('marketplace') }}"
            class="back-link"
        >
            ← Marketplace
        </a>

    </nav>


    <!-- FORM -->
    <div class="container">

        <div class="form-card">

            <h1>🛒 Sell a Product</h1>

            <p class="subtitle">
                List your product and connect with students on campus.
            </p>


            <form
                method="POST"
                action="{{ url_for('add_product') }}"
                enctype="multipart/form-data"
            >

                <!-- CSRF PROTECTION -->
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >


                <!-- PRODUCT NAME -->
                <div class="form-group">

                    <label for="name">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="e.g. HP Laptop"
                        required
                    >

                </div>


                <!-- DESCRIPTION -->
                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Describe your product..."
                        required
                    ></textarea>

                </div>


                <!-- PRICE -->
                <div class="form-group">

                    <label for="price">
                        Price (₦)
                    </label>

                    <input
                        type="number"
                        id="price"
                        name="price"
                        placeholder="e.g. 150000"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <!-- CATEGORY -->
                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select
                        id="category"
                        name="category"
                        required
                    >

                        <option value="">
                            Select a category
                        </option>

                        <option value="Electronics">
                            Electronics
                        </option>

                        <option value="Fashion">
                            Fashion
                        </option>

                        <option value="Books">
                            Books
                        </option>

                        <option value="Hostel">
                            Hostel Items
                        </option>

                        <option value="Food">
                            Food
                        </option>

                        <option value="Services">
                            Services
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- LOCATION -->
                <div class="form-group">

                    <label for="location">
                        Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="e.g. ESUT Agbani Campus"
                        required
                    >

                    <span class="hint">
                        Tell buyers where they can meet you.
                    </span>

                </div>


                <!-- IMAGE -->
                <div class="form-group">

                    <label for="image">
                        Product Image
                    </label>

                    <input
                        type="file"
                        id="image"
                        name="image"
                        accept=".jpg,.jpeg,.png,.gif"
                        required
                    >

                    <span class="hint">
                        Allowed formats: JPG, JPEG, PNG and GIF.
                    </span>

                </div>


                <!-- SUBMIT -->
                <button
                    type="submit"
                    class="submit-btn"
                >
                    🚀 Publish Product
                </button>


                <!-- CANCEL -->
                <a
                    href="{{ url_for('marketplace') }}"
                    class="cancel-btn"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</body>
</html>
