<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Profile - UniCamplink</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <nav class="navbar">

        <a href="/dashboard" class="logo">
            <img
                src="{{ url_for('static', filename='images/unicamplink-logo.png') }}"
                alt="UniCamplink Logo"
            >
            <span>UniCamplink</span>
        </a>

        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/feed">Feed</a>
            <a href="/profile">Profile</a>
            <form
                action="{{ url_for('logout') }}"
                method="POST"
                style="display: inline;"
            >
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >
                <button
                    type="submit"
                    style="
                        background: none;
                        border: none;
                        color: inherit;
                        cursor: pointer;
                    "
                >
                    Logout
                </button>
            </form>

    </nav>


    <main class="edit-profile-container">

        <div class="edit-profile-card">

            <h1>Edit Profile</h1>

            <form method="POST" enctype="multipart/form-data">

                <!-- CSRF Protection -->
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <label for="profile_picture">
                    Profile Picture
                </label>

                <input
                    type="file"
                    id="profile_picture"
                    name="profile_picture"
                    accept=".png,.jpg,.jpeg,.gif"
                >

                <label for="bio">
                    About Me
                </label>

                <textarea
                    id="bio"
                    name="bio"
                    placeholder="Tell other students about yourself..."
                    maxlength="300"
                >{{ user["bio"] or "" }}</textarea>

                <p class="bio-limit">
                    Maximum 300 characters
                </p>

                <button type="submit">
                    Save Changes
                </button>

            </form>

            <a href="/profile" class="cancel-btn">
                Cancel
            </a>

        </div>

    </main>

</body>
</html>
