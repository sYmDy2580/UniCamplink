<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Profile - UniCamplink</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <style>
        /* =========================================================
           RAZOR EDIT PROFILE
        ========================================================= */

        :root {
            --edit-primary: #38bdf8;
            --edit-primary-dark: #0ea5e9;
            --edit-bg: #07111f;
            --edit-card: rgba(15, 23, 42, 0.88);
            --edit-border: rgba(148, 163, 184, 0.14);
            --edit-text: #f8fafc;
            --edit-muted: #94a3b8;
            --edit-input: rgba(2, 6, 23, 0.7);
            --edit-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--edit-text);
            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(56, 189, 248, 0.10),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 85% 25%,
                    rgba(14, 165, 233, 0.08),
                    transparent 30%
                ),
                var(--edit-bg);
        }

        /* =========================================================
           NAVBAR
        ========================================================= */

        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;

            width: 100%;

            background: rgba(7, 17, 31, 0.82);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border-bottom: 1px solid var(--edit-border);
        }

        .navbar-inner {
            width: min(1200px, calc(100% - 28px));
            min-height: 72px;

            margin: auto;

            display: flex;
            align-items: center;
            gap: 22px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            color: inherit;
            text-decoration: none;

            flex-shrink: 0;
        }

        .logo img {
            width: 42px;
            height: 42px;

            object-fit: contain;

            border-radius: 12px;

            filter:
                drop-shadow(
                    0 5px 15px rgba(56, 189, 248, 0.20)
                );
        }

        .logo span {
            font-size: 1.08rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            white-space: nowrap;
        }

        .logo span::after {
            content: ".";
            color: var(--edit-primary);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 6px;

            margin-left: auto;

            overflow-x: auto;
            scrollbar-width: none;
        }

        .nav-links::-webkit-scrollbar {
            display: none;
        }

        .nav-links a,
        .logout-button {
            min-height: 40px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 9px 13px;

            border-radius: 10px;

            color: #cbd5e1;
            text-decoration: none;

            font-size: 0.9rem;
            font-weight: 650;

            white-space: nowrap;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .nav-links a:hover,
        .logout-button:hover {
            color: white;
            background: rgba(56, 189, 248, 0.10);
        }

        .nav-links a:active,
        .logout-button:active {
            transform: scale(0.97);
        }

        .logout-button {
            border: 0;
            background: transparent;
            cursor: pointer;
            font-family: inherit;
        }

        /* =========================================================
           MAIN
        ========================================================= */

        .edit-profile-container {
            width: min(760px, calc(100% - 28px));

            margin: 48px auto 70px;
        }

        /* =========================================================
           CARD
        ========================================================= */

        .edit-profile-card {
            position: relative;

            padding: 34px;

            border: 1px solid var(--edit-border);
            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    rgba(15, 23, 42, 0.96),
                    rgba(8, 18, 32, 0.88)
                );

            box-shadow: var(--edit-shadow);

            overflow: hidden;
        }

        .edit-profile-card::before {
            content: "";

            position: absolute;

            width: 240px;
            height: 240px;

            top: -130px;
            right: -100px;

            background: rgba(56, 189, 248, 0.12);

            border-radius: 50%;

            filter: blur(20px);

            pointer-events: none;
        }

        .edit-profile-header {
            position: relative;

            display: flex;
            align-items: center;
            gap: 18px;

            margin-bottom: 30px;
        }

        .edit-icon {
            width: 58px;
            height: 58px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 17px;

            background:
                linear-gradient(
                    135deg,
                    rgba(56, 189, 248, 0.20),
                    rgba(14, 165, 233, 0.08)
                );

            border: 1px solid rgba(56, 189, 248, 0.20);

            font-size: 1.6rem;

            flex-shrink: 0;
        }

        .edit-profile-header h1 {
            margin: 0 0 5px;

            font-size: clamp(1.55rem, 4vw, 2rem);
            letter-spacing: -0.04em;
        }

        .edit-profile-header p {
            margin: 0;

            color: var(--edit-muted);

            font-size: 0.92rem;
            line-height: 1.5;
        }

        /* =========================================================
           FORM
        ========================================================= */

        .edit-profile-form {
            position: relative;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;

            margin-bottom: 9px;

            color: #e2e8f0;

            font-size: 0.9rem;
            font-weight: 700;
        }

        .field-hint {
            margin: 7px 0 0;

            color: var(--edit-muted);

            font-size: 0.78rem;
            line-height: 1.45;
        }

        input[type="text"],
        textarea {
            width: 100%;

            border: 1px solid rgba(148, 163, 184, 0.17);
            border-radius: 13px;

            background: var(--edit-input);

            color: white;

            font-family: inherit;
            font-size: 0.95rem;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        input[type="text"] {
            height: 50px;

            padding: 0 15px;
        }

        textarea {
            min-height: 145px;

            padding: 14px 15px;

            resize: vertical;

            line-height: 1.55;
        }

        input[type="text"]::placeholder,
        textarea::placeholder {
            color: #64748b;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: rgba(56, 189, 248, 0.72);

            background: rgba(2, 6, 23, 0.88);

            box-shadow:
                0 0 0 4px rgba(56, 189, 248, 0.08);
        }

        /* =========================================================
           FILE UPLOAD
        ========================================================= */

        .picture-upload {
            padding: 17px;

            border: 1px dashed rgba(56, 189, 248, 0.28);
            border-radius: 15px;

            background: rgba(56, 189, 248, 0.035);
        }

        input[type="file"] {
            width: 100%;

            color: #cbd5e1;

            font-family: inherit;
            font-size: 0.88rem;
        }

        input[type="file"]::file-selector-button {
            margin-right: 12px;

            padding: 9px 13px;

            border: 1px solid rgba(56, 189, 248, 0.28);
            border-radius: 9px;

            background: rgba(56, 189, 248, 0.10);
            color: #e0f2fe;

            font-family: inherit;
            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease;
        }

        input[type="file"]::file-selector-button:hover {
            background: rgba(56, 189, 248, 0.18);
            border-color: rgba(56, 189, 248, 0.48);
        }

        /* =========================================================
           BIO COUNTER
        ========================================================= */

        .bio-footer {
            display: flex;
            justify-content: space-between;
            gap: 12px;

            margin-top: 7px;
        }

        .bio-limit {
            margin: 0;

            color: var(--edit-muted);

            font-size: 0.76rem;
        }

        #bioCount {
            color: #64748b;
            font-size: 0.76rem;
        }

        /* =========================================================
           ACTIONS
        ========================================================= */

        .form-actions {
            display: flex;
            align-items: center;
            gap: 12px;

            margin-top: 30px;
            padding-top: 23px;

            border-top: 1px solid rgba(148, 163, 184, 0.10);
        }

        .save-button,
        .cancel-btn {
            min-height: 48px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            padding: 0 20px;

            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 750;

            text-decoration: none;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;
        }

        .save-button {
            flex: 1;

            border: 0;

            color: #03111d;

            background:
                linear-gradient(
                    135deg,
                    #38bdf8,
                    #0ea5e9
                );

            box-shadow:
                0 10px 25px rgba(14, 165, 233, 0.18);
        }

        .save-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 15px 30px rgba(14, 165, 233, 0.25);
        }

        .cancel-btn {
            border: 1px solid rgba(148, 163, 184, 0.17);

            color: #cbd5e1;

            background: rgba(148, 163, 184, 0.06);
        }

        .cancel-btn:hover {
            transform: translateY(-2px);

            color: white;

            background: rgba(148, 163, 184, 0.11);

            border-color: rgba(148, 163, 184, 0.28);
        }

        .save-button:active,
        .cancel-btn:active {
            transform: scale(0.98);
        }

        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 700px) {

            .navbar-inner {
                width: calc(100% - 18px);
                min-height: 64px;

                gap: 10px;
            }

            .logo img {
                width: 38px;
                height: 38px;
            }

            .logo span {
                font-size: 0.98rem;
            }

            .nav-links {
                gap: 3px;
            }

            .nav-links a,
            .logout-button {
                min-height: 37px;

                padding: 8px 10px;

                font-size: 0.78rem;
            }

            .edit-profile-container {
                width: calc(100% - 18px);

                margin: 24px auto 45px;
            }

            .edit-profile-card {
                padding: 23px 17px;

                border-radius: 19px;
            }

            .edit-profile-header {
                gap: 13px;

                margin-bottom: 25px;
            }

            .edit-icon {
                width: 49px;
                height: 49px;

                border-radius: 14px;

                font-size: 1.35rem;
            }

            .edit-profile-header h1 {
                font-size: 1.45rem;
            }

            .edit-profile-header p {
                font-size: 0.82rem;
            }

            .form-group {
                margin-bottom: 19px;
            }

            .form-actions {
                flex-direction: column;
            }

            .save-button,
            .cancel-btn {
                width: 100%;
            }
        }

        @media (max-width: 470px) {

            .logo span {
                display: none;
            }

            .nav-links a:nth-child(1) {
                display: none;
            }

            .nav-links a,
            .logout-button {
                padding-left: 8px;
                padding-right: 8px;

                font-size: 0.74rem;
            }

            .edit-profile-card {
                padding: 20px 14px;
            }
        }

        /* =========================================================
           LIGHT MODE
        ========================================================= */

        body.light-mode {
            --edit-bg: #f1f5f9;
            --edit-card: rgba(255, 255, 255, 0.94);
            --edit-border: rgba(15, 23, 42, 0.10);
            --edit-text: #0f172a;
            --edit-muted: #64748b;
            --edit-input: rgba(248, 250, 252, 0.96);

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(56, 189, 248, 0.13),
                    transparent 28%
                ),
                #f1f5f9;
        }

        body.light-mode .navbar {
            background: rgba(255, 255, 255, 0.82);
        }

        body.light-mode .nav-links a,
        body.light-mode .logout-button {
            color: #475569;
        }

        body.light-mode .nav-links a:hover,
        body.light-mode .logout-button:hover {
            color: #0284c7;
            background: rgba(14, 165, 233, 0.08);
        }

        body.light-mode .edit-profile-card {
            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.98),
                    rgba(248, 250, 252, 0.94)
                );

            box-shadow:
                0 24px 60px rgba(15, 23, 42, 0.10);
        }

        body.light-mode .edit-profile-header h1 {
            color: #0f172a;
        }

        body.light-mode .edit-profile-header p,
        body.light-mode .field-hint,
        body.light-mode .bio-limit {
            color: #64748b;
        }

        body.light-mode .form-group label {
            color: #334155;
        }

        body.light-mode input[type="text"],
        body.light-mode textarea {
            color: #0f172a;

            background: #ffffff;

            border-color: rgba(15, 23, 42, 0.12);
        }

        body.light-mode input[type="text"]:focus,
        body.light-mode textarea:focus {
            background: #ffffff;

            border-color: rgba(14, 165, 233, 0.65);
        }

        body.light-mode .cancel-btn {
            color: #475569;
            background: rgba(15, 23, 42, 0.035);
        }

        body.light-mode .cancel-btn:hover {
            color: #0f172a;
            background: rgba(15, 23, 42, 0.06);
        }
    </style>
</head>

<body>

    <!-- =========================================================
         NAVBAR
    ========================================================== -->

    <nav class="navbar">

        <div class="navbar-inner">

            <a href="/dashboard" class="logo">

                <img
                    src="{{ url_for('static', filename='images/unicamplink-logo.png') }}"
                    alt="UniCamplink Logo"
                >

                <span>UniCamplink</span>

            </a>


            <div class="nav-links">

                <a href="/dashboard">
                    Dashboard
                </a>

                <a href="/feed">
                    Feed
                </a>

                <a href="/profile">
                    Profile
                </a>


                <form
                    action="{{ url_for('logout') }}"
                    method="POST"
                    style="display:inline;"
                >

                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}"
                    >

                    <button
                        type="submit"
                        class="logout-button"
                    >
                        Logout
                    </button>

                </form>

            </div>

        </div>

    </nav>


    <!-- =========================================================
         MAIN CONTENT
    ========================================================== -->

    <main class="edit-profile-container">

        <section class="edit-profile-card">

            <div class="edit-profile-header">

                <div class="edit-icon">
                    ✏️
                </div>

                <div>

                    <h1>
                        Edit Profile
                    </h1>

                    <p>
                        Keep your UniCamplink profile up to date.
                    </p>

                </div>

            </div>


            <!-- =================================================
                 FORM
            ================================================== -->

            <form
                method="POST"
                enctype="multipart/form-data"
                class="edit-profile-form"
            >

                <!-- CSRF -->
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        value="{{ user['name'] or '' }}"
                        placeholder="Enter your full name"
                        maxlength="100"
                        autocomplete="name"
                        required
                    >

                    <p class="field-hint">
                        Use the name other students know you by.
                    </p>

                </div>


                <!-- UNIVERSITY -->

                <div class="form-group">

                    <label for="university">
                        University
                    </label>

                    <input
                        type="text"
                        id="university"
                        name="university"
                        value="{{ user['university'] or '' }}"
                        placeholder="Enter your university"
                        maxlength="150"
                        autocomplete="organization"
                        required
                    >

                </div>


                <!-- PROFILE PICTURE -->

                <div class="form-group">

                    <label for="profile_picture">
                        Profile Picture
                    </label>

                    <div class="picture-upload">

                        <input
                            type="file"
                            id="profile_picture"
                            name="profile_picture"
                            accept=".png,.jpg,.jpeg,.gif,image/png,image/jpeg,image/gif"
                        >

                        <p class="field-hint">
                            JPG, JPEG, PNG or GIF. Choose a clear image that
                            represents you.
                        </p>

                    </div>

                </div>


                <!-- BIO -->

                <div class="form-group">

                    <label for="bio">
                        About Me
                    </label>

                    <textarea
                        id="bio"
                        name="bio"
                        placeholder="Tell other students about yourself..."
                        maxlength="500"
                    >{{ user["bio"] or "" }}</textarea>

                    <div class="bio-footer">

                        <p class="bio-limit">
                            Maximum 500 characters
                        </p>

                        <span id="bioCount">
                            0 / 500
                        </span>

                    </div>

                </div>


                <!-- ACTIONS -->

                <div class="form-actions">

                    <button
                        type="submit"
                        class="save-button"
                    >
                        💾 Save Changes
                    </button>

                    <a
                        href="/profile"
                        class="cancel-btn"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </section>

    </main>


    <!-- =========================================================
         BIO CHARACTER COUNTER
    ========================================================== -->

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const bio = document.getElementById("bio");
            const counter = document.getElementById("bioCount");

            if (!bio || !counter) {
                return;
            }

            function updateBioCount() {

                const length = bio.value.length;

                counter.textContent = `${length} / 500`;

            }

            bio.addEventListener("input", updateBioCount);

            updateBioCount();

        });

    </script>


    <!-- =========================================================
         THEME SUPPORT
    ========================================================== -->

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>

</body>
</html>
