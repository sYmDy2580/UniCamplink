<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join UniCamplink</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <a href="/" class="logo">
            <img
                src="{{ url_for('static', filename='images/unicamplink-logo.png') }}"
                alt="UniCamplink Logo"
            >
            <span>UniCamplink</span>
        </a>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/login">Login</a>
        </div>

    </nav>


    <!-- Sign Up Section -->
    <section class="auth-section">

        <div class="auth-card">

            <h1>Join UniCamplink</h1>

            <p>
                Create your student account and connect with your campus.
            </p>


            <form action="/signup" method="POST">

                <!-- CSRF Protection -->
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <input
                    type="text"
                    name="name"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="email"
                    name="email"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="text"
                    name="university"
                    placeholder="University"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Create Account
                </button>

            </form>


            <p class="auth-link">

                Already have an account?

                <a href="/login">
                    Login
                </a>

            </p>

        </div>

    </section>

</body>
</html>
