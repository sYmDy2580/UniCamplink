<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Chat with {{ other_user["name"] }} - UniCamplink
    </title>

    <style>

        /* =========================================================
           RAZOR CHAT
           ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #38bdf8;
            --primary-dark: #0284c7;

            --page-bg: #f1f5f9;
            --card-bg: #ffffff;

            --text: #0f172a;
            --muted: #64748b;

            --border: #e2e8f0;

            --received: #ffffff;
            --sent: #0284c7;

            --header-bg: #ffffff;
        }


        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: var(--page-bg);

            color: var(--text);

            min-height: 100vh;

            overflow: hidden;
        }


        /* =========================================================
           TOP BAR
           ========================================================= */

        .chat-topbar {

            height: 64px;

            display: flex;

            align-items: center;

            gap: 12px;

            padding: 8px 18px;

            background: var(--header-bg);

            border-bottom:
                1px solid var(--border);

            box-shadow:
                0 2px 12px
                rgba(15, 23, 42, 0.06);

            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            z-index: 100;
        }


        .back-button {

            width: 40px;
            height: 40px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: var(--text);

            text-decoration: none;

            font-size: 21px;

            transition:
                background 0.2s ease;
        }


        .back-button:hover {

            background:
                rgba(148, 163, 184, 0.12);
        }


        /* =========================================================
           CHAT USER AVATAR
           ========================================================= */

        .chat-user-avatar {

            width: 42px;
            height: 42px;

            border-radius: 50%;

            overflow: hidden;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #38bdf8,
                    #0284c7
                );

            color: white;

            font-size: 17px;
            font-weight: 800;

            border:
                2px solid
                rgba(56, 189, 248, 0.25);
        }


        .chat-user-avatar img {

            width: 100%;
            height: 100%;

            object-fit: cover;
        }


        /* =========================================================
           USER INFO
           ========================================================= */

        .chat-user-info {

            min-width: 0;

            flex: 1;
        }


        .chat-user-info h2 {

            font-size: 16px;

            font-weight: 800;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            margin-bottom: 2px;
        }


        .chat-user-info p {

            font-size: 12px;

            color: var(--muted);

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        #user-status {

            display: flex;

            align-items: center;

            gap: 4px;

            margin-top: 2px;

            font-size: 11px;

            color: var(--muted);
        }


        /* =========================================================
           PROFILE BUTTON
           ========================================================= */

        .profile-button {

            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-height: 38px;

            padding: 0 13px;

            border-radius: 10px;

            color: var(--primary-dark);

            background:
                rgba(56, 189, 248, 0.09);

            text-decoration: none;

            font-size: 13px;

            font-weight: 750;

            white-space: nowrap;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        .profile-button:hover {

            background:
                rgba(56, 189, 248, 0.16);

            transform:
                translateY(-1px);
        }


        /* =========================================================
           CHAT AREA
           ========================================================= */

        .chat-container {

            position: fixed;

            top: 64px;

            left: 0;
            right: 0;

            bottom: 0;

            max-width: 1000px;

            margin: 0 auto;

            display: flex;

            flex-direction: column;

            background:
                var(--page-bg);
        }


        /* =========================================================
           MESSAGES
           ========================================================= */

        #messages {

            flex: 1;

            overflow-y: auto;

            padding:
                22px 18px 20px;

            display: flex;

            flex-direction: column;

            gap: 7px;

            scroll-behavior: smooth;
        }


        #messages::-webkit-scrollbar {

            width: 6px;
        }


        #messages::-webkit-scrollbar-track {

            background: transparent;
        }


        #messages::-webkit-scrollbar-thumb {

            background:
                #cbd5e1;

            border-radius: 20px;
        }


        /* =========================================================
           MESSAGE ROW
           ========================================================= */

        .message-row {

            display: flex;

            width: 100%;

            align-items: flex-end;

            gap: 7px;
        }


        .message-row.sent {

            justify-content: flex-end;
        }


        .message-row.received {

            justify-content: flex-start;
        }


        /* =========================================================
           SMALL RECEIVED AVATAR
        ========================================================= */

        .message-avatar {

            width: 27px;
            height: 27px;

            border-radius: 50%;

            overflow: hidden;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #38bdf8,
                    #0284c7
                );

            color: white;

            font-size: 11px;

            font-weight: 800;
        }


        .message-avatar img {

            width: 100%;
            height: 100%;

            object-fit: cover;
        }


        /* =========================================================
           MESSAGE BUBBLE
           ========================================================= */

        .message {

            max-width: min(70%, 620px);

            padding:
                9px 13px;

            border-radius: 18px;

            font-size: 14px;

            line-height: 1.5;

            word-break: break-word;

            overflow-wrap: anywhere;

            box-shadow:
                0 1px 2px
                rgba(15, 23, 42, 0.05);
        }


        .message-row.sent .message {

            background:
                var(--sent);

            color: white;

            border-bottom-right-radius: 5px;
        }


        .message-row.received .message {

            background:
                var(--received);

            color: var(--text);

            border:
                1px solid var(--border);

            border-bottom-left-radius: 5px;
        }


        /* =========================================================
           TIME
           ========================================================= */

        .time {

            display: block;

            font-size: 9px;

            margin-top: 4px;

            opacity: 0.65;

            text-align: right;

            white-space: nowrap;
        }


        /* =========================================================
           EMPTY CHAT
           ========================================================= */

        .empty-chat {

            margin: auto;

            text-align: center;

            max-width: 300px;

            padding: 30px;
        }


        .empty-icon {

            width: 70px;
            height: 70px;

            margin: 0 auto 15px;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                rgba(56, 189, 248, 0.12);

            font-size: 32px;
        }


        .empty-chat h3 {

            margin-bottom: 7px;

            font-size: 17px;
        }


        .empty-chat p {

            color: var(--muted);

            font-size: 13px;

            line-height: 1.5;
        }


        /* =========================================================
           MESSAGE COMPOSER
           ========================================================= */

        .message-form {

            display: flex;

            align-items: center;

            gap: 9px;

            padding:
                10px 14px;

            background:
                var(--header-bg);

            border-top:
                1px solid var(--border);

            box-shadow:
                0 -3px 15px
                rgba(15, 23, 42, 0.04);
        }


        .message-input-wrapper {

            flex: 1;

            position: relative;
        }


        .message-form input[type="text"] {

            width: 100%;

            min-height: 43px;

            padding:
                11px 16px;

            border:
                1px solid var(--border);

            border-radius: 24px;

            background:
                var(--page-bg);

            color:
                var(--text);

            outline: none;

            font-family: inherit;

            font-size: 14px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        .message-form input[type="text"]:focus {

            border-color:
                var(--primary);

            box-shadow:
                0 0 0 3px
                rgba(56, 189, 248, 0.12);
        }


        .message-form button {

            width: 43px;
            height: 43px;

            border: none;

            border-radius: 50%;

            background:
                var(--primary-dark);

            color: white;

            font-size: 17px;

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-shrink: 0;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }


        .message-form button:hover {

            background:
                #0369a1;

            transform:
                translateY(-1px);
        }


        .message-form button:disabled {

            opacity: 0.55;

            cursor: not-allowed;

            transform: none;
        }


        /* =========================================================
           TYPING / CONNECTION INDICATOR
           ========================================================= */

        .connection-indicator {

            display: none;

            position: absolute;

            bottom: 70px;

            left: 50%;

            transform:
                translateX(-50%);

            padding:
                6px 11px;

            border-radius: 999px;

            background:
                rgba(15, 23, 42, 0.8);

            color: white;

            font-size: 11px;

            z-index: 5;
        }


        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 650px) {

            .chat-topbar {

                height: 60px;

                padding:
                    7px 10px;

                gap: 8px;
            }


            .chat-container {

                top: 60px;
            }


            .back-button {

                width: 36px;
                height: 36px;

                font-size: 20px;
            }


            .chat-user-avatar {

                width: 38px;
                height: 38px;
            }


            .chat-user-info h2 {

                font-size: 15px;
            }


            .chat-user-info p {

                font-size: 10px;
            }


            #user-status {

                font-size: 10px;
            }


            .profile-button {

                min-height: 35px;

                padding:
                    0 10px;

                font-size: 11px;
            }


            #messages {

                padding:
                    15px 9px 15px;

                gap: 6px;
            }


            .message {

                max-width: 82%;

                padding:
                    8px 11px;

                font-size: 14px;
            }


            .message-avatar {

                width: 24px;
                height: 24px;
            }


            .message-form {

                padding:
                    8px;
            }


            .message-form input[type="text"] {

                min-height: 41px;

                font-size: 14px;
            }


            .message-form button {

                width: 41px;
                height: 41px;
            }

        }


        @media (max-width: 430px) {

            .profile-button {

                font-size: 0;

                width: 35px;
                padding: 0;
            }


            .profile-button::after {

                content: "👤";

                font-size: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================================
         CHAT HEADER
         ========================================================= -->

    <header class="chat-topbar">


        <a
            href="/messages"
            class="back-button"
            aria-label="Back to messages"
        >
            ‹
        </a>


        <!-- USER AVATAR -->

        <div class="chat-user-avatar">

            {% if other_user["profile_picture"] %}

                <img
                    src="{{ url_for(
                        'static',
                        filename='uploads/' +
                        other_user['profile_picture']
                    ) }}"
                    alt="{{ other_user['name'] }}"
                >

            {% else %}

                {{ other_user["name"][0]|upper
                   if other_user["name"]
                   else "U" }}

            {% endif %}

        </div>


        <!-- USER INFORMATION -->

        <div class="chat-user-info">

            <h2>
                {{ other_user["name"] }}
            </h2>

            <p>
                {{ other_user["university"] }}
            </p>

            <div id="user-status">
                Checking status...
            </div>

        </div>


        <!-- PROFILE -->

        <a
            href="/profile/{{ other_user['id'] }}"
            class="profile-button"
        >
            View Profile
        </a>


    </header>



    <!-- =========================================================
         CHAT
         ========================================================= -->

    <main class="chat-container">


        <div id="messages">

            <div class="empty-chat">

                <div class="empty-icon">
                    💬
                </div>

                <h3>
                    Loading conversation...
                </h3>

                <p>
                    Please wait.
                </p>

            </div>

        </div>


        <div
            class="connection-indicator"
            id="connection-indicator"
        >
            Updating conversation...
        </div>


        <!-- =====================================================
             MESSAGE FORM
             ===================================================== -->

        <form
            method="POST"
            class="message-form"
            id="message-form"
        >

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >


            <div class="message-input-wrapper">

                <input
                    type="text"
                    name="message"
                    id="message-input"
                    placeholder="Message {{ other_user['name'] }}..."
                    autocomplete="off"
                    maxlength="2000"
                    required
                >

            </div>


            <button
                type="submit"
                aria-label="Send message"
                title="Send message"
            >
                ➤
            </button>

        </form>


    </main>



    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script>

        const messagesContainer =
            document.getElementById("messages");

        const messageForm =
            document.getElementById("message-form");

        const messageInput =
            document.getElementById("message-input");

        const statusElement =
            document.getElementById("user-status");

        const connectionIndicator =
            document.getElementById(
                "connection-indicator"
            );


        const currentUserId =
            Number("{{ session['user_id'] }}");


        const otherUserId =
            Number("{{ other_user['id'] }}");


        let firstLoad = true;

        let lastMessageSignature = "";


        /* =====================================================
           ESCAPE HTML
           ===================================================== */

        function escapeHtml(text) {

            const div =
                document.createElement("div");

            div.textContent =
                text || "";

            return div.innerHTML;
        }


        /* =====================================================
           FORMAT MESSAGE TIME
           ===================================================== */

        function formatMessageTime(createdAt) {

            if (!createdAt) {
                return "";
            }


            const date =
                new Date(
                    createdAt.replace(
                        " ",
                        "T"
                    ) + "Z"
                );


            if (isNaN(date.getTime())) {
                return createdAt;
            }


            return date.toLocaleTimeString(
                "en-NG",
                {
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: true
                }
            );

        }


        /* =====================================================
           USER STATUS
           ===================================================== */

        function updateUserStatus(lastSeen) {

            if (!statusElement) {
                return;
            }


            if (!lastSeen) {

                statusElement.textContent =
                    "Last seen unavailable";

                statusElement.style.color =
                    "#64748b";

                return;
            }


            const lastSeenDate =
                new Date(
                    lastSeen.replace(
                        " ",
                        "T"
                    ) + "Z"
                );


            if (isNaN(lastSeenDate.getTime())) {

                statusElement.textContent =
                    "Last seen recently";

                statusElement.style.color =
                    "#64748b";

                return;
            }


            const now =
                new Date();


            const difference =
                Math.floor(
                    (
                        now -
                        lastSeenDate
                    ) / 1000
                );


            if (
                difference >= 0 &&
                difference <= 30
            ) {

                statusElement.textContent =
                    "🟢 Online";

                statusElement.style.color =
                    "#16a34a";

                return;
            }


            if (difference < 60) {

                statusElement.textContent =
                    "Last seen just now";

                statusElement.style.color =
                    "#64748b";

                return;
            }


            if (difference < 3600) {

                const minutes =
                    Math.floor(
                        difference / 60
                    );

                statusElement.textContent =
                    `Last seen ${minutes} minute${
                        minutes === 1
                            ? ""
                            : "s"
                    } ago`;

                statusElement.style.color =
                    "#64748b";

                return;
            }


            if (difference < 86400) {

                const hours =
                    Math.floor(
                        difference / 3600
                    );

                statusElement.textContent =
                    `Last seen ${hours} hour${
                        hours === 1
                            ? ""
                            : "s"
                    } ago`;

                statusElement.style.color =
                    "#64748b";

                return;
            }


            statusElement.textContent =
                "Last seen recently";

            statusElement.style.color =
                "#64748b";

        }


        /* =====================================================
           CHECK IF USER IS NEAR BOTTOM
        ===================================================== */

        function isNearBottom() {

            if (!messagesContainer) {
                return true;
            }


            return (
                messagesContainer.scrollHeight -
                messagesContainer.scrollTop -
                messagesContainer.clientHeight
            ) < 100;

        }


        /* =====================================================
           RENDER MESSAGES
        ===================================================== */

        function renderMessages(messageList) {

            if (!messagesContainer) {
                return;
            }


            if (
                !Array.isArray(messageList) ||
                messageList.length === 0
            ) {

                messagesContainer.innerHTML = `

                    <div class="empty-chat">

                        <div class="empty-icon">
                            💬
                        </div>

                        <h3>
                            Start a conversation
                        </h3>

                        <p>
                            Send a message to
                            ${escapeHtml(
                                "{{ other_user['name'] }}"
                            )}
                        </p>

                    </div>

                `;

                return;
            }


            const signature =
                messageList
                    .map(message =>
                        `${message.id || ""}:${
                            message.created_at || ""
                        }`
                    )
                    .join("|");


            const shouldStayAtBottom =
                firstLoad ||
                isNearBottom();


            /*
             * Don't rebuild the entire conversation
             * if nothing has changed.
             */

            if (
                signature ===
                lastMessageSignature
            ) {

                return;
            }


            lastMessageSignature =
                signature;


            messagesContainer.innerHTML =
                messageList
                    .map(message => {

                        const isSent =
                            Number(
                                message.sender_id
                            ) ===
                            Number(
                                currentUserId
                            );


                        let avatar = "";


                        if (!isSent) {

                            if (
                                message.profile_picture
                            ) {

                                avatar = `

                                    <div class="message-avatar">

                                        <img
                                            src="/static/uploads/${
                                                encodeURIComponent(
                                                    message.profile_picture
                                                )
                                            }"
                                            alt=""
                                        >

                                    </div>

                                `;

                            } else {

                                avatar = `

                                    <div class="message-avatar">

                                        ${
                                            escapeHtml(
                                                (
                                                    message.sender_name ||
                                                    "U"
                                                )[0]
                                            ).toUpperCase()
                                        }

                                    </div>

                                `;

                            }

                        }


                        return `

                            <div class="message-row ${
                                isSent
                                    ? "sent"
                                    : "received"
                            }">

                                ${
                                    !isSent
                                        ? avatar
                                        : ""
                                }


                                <div class="message">

                                    ${escapeHtml(
                                        message.message
                                    )}

                                    <span class="time">

                                        ${formatMessageTime(
                                            message.created_at
                                        )}

                                    </span>

                                </div>

                            </div>

                        `;

                    })
                    .join("");


            if (shouldStayAtBottom) {

                messagesContainer.scrollTop =
                    messagesContainer.scrollHeight;

            }


            firstLoad = false;

        }


        /* =====================================================
           LOAD CHAT
        ===================================================== */

        async function loadChatMessages() {

            try {

                const response =
                    await fetch(
                        `/api/chat/${otherUserId}/messages`,
                        {
                            method: "GET",
                            cache: "no-store",
                            headers: {
                                "Accept":
                                    "application/json"
                            }
                        }
                    );


                if (!response.ok) {

                    console.error(
                        "Chat API error:",
                        response.status
                    );

                    return;
                }


                const data =
                    await response.json();


                if (
                    data &&
                    data.other_user_last_seen
                ) {

                    updateUserStatus(
                        data.other_user_last_seen
                    );

                }


                if (
                    data &&
                    Array.isArray(
                        data.messages
                    )
                ) {

                    renderMessages(
                        data.messages
                    );

                }

            }

            catch (error) {

                console.error(
                    "Live chat update failed:",
                    error
                );

            }

        }


        /* =====================================================
           SEND MESSAGE
        ===================================================== */

        if (messageForm) {

            messageForm.addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const message =
                        messageInput.value.trim();


                    if (!message) {
                        return;
                    }


                    if (message.length > 2000) {

                        alert(
                            "Message cannot exceed 2000 characters."
                        );

                        return;
                    }


                    const csrfInput =
                        messageForm.querySelector(
                            'input[name="csrf_token"]'
                        );


                    const csrfToken =
                        csrfInput
                            ? csrfInput.value
                            : "";


                    const sendButton =
                        messageForm.querySelector(
                            'button[type="submit"]'
                        );


                    if (sendButton) {

                        sendButton.disabled =
                            true;

                        sendButton.textContent =
                            "…";

                    }


                    try {

                        const response =
                            await fetch(
                                window.location.href,
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/x-www-form-urlencoded",

                                        "X-Requested-With":
                                            "XMLHttpRequest",

                                        "Accept":
                                            "application/json"
                                    },

                                    body:
                                        new URLSearchParams({
                                            csrf_token:
                                                csrfToken,

                                            message:
                                                message
                                        })
                                }
                            );


                        if (!response.ok) {

                            console.error(
                                "Message sending failed:",
                                response.status
                            );

                            alert(
                                "Could not send message. Please try again."
                            );

                            return;
                        }


                        messageInput.value =
                            "";


                        /*
                         * Reset the signature so the
                         * newly-sent message renders.
                         */

                        lastMessageSignature =
                            "";


                        await loadChatMessages();


                        messagesContainer.scrollTop =
                            messagesContainer.scrollHeight;

                    }

                    catch (error) {

                        console.error(
                            "Message sending error:",
                            error
                        );

                        alert(
                            "Could not send message. Please try again."
                        );

                    }

                    finally {

                        if (sendButton) {

                            sendButton.disabled =
                                false;

                            sendButton.textContent =
                                "➤";

                        }


                        messageInput.focus();

                    }

                }
            );

        }


        /* =====================================================
           INITIAL LOAD
        ===================================================== */

        loadChatMessages();


        /* =====================================================
           LIVE CHAT POLLING
        ===================================================== */

        setInterval(
            loadChatMessages,
            3000
        );


        /* =====================================================
           ENTER TO SEND
        ===================================================== */

        if (messageInput) {

            messageInput.addEventListener(
                "keydown",
                function(event) {

                    if (
                        event.key === "Enter" &&
                        !event.shiftKey
                    ) {

                        event.preventDefault();

                        messageForm.requestSubmit();

                    }

                }
            );

        }

    </script>

</body>

</html>
