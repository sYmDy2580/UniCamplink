<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="csrf-token"
        content="{{ csrf_token() }}"
    >

    <title>UniCamplink AI</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <script
        src="{{ url_for('static', filename='js/theme.js') }}"
        defer
    ></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .ai-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .ai-header {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            border-bottom: 1px solid rgba(128, 128, 128, 0.2);
            backdrop-filter: blur(12px);
        }

        .ai-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
        }

        .ai-brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #38bdf8;
            color: white;
            font-size: 20px;
        }

        .ai-back {
            text-decoration: none;
            color: inherit;
            padding: 9px 14px;
            border-radius: 10px;
            border: 1px solid rgba(128, 128, 128, 0.25);
            font-size: 14px;
        }

        .ai-main {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 24px 16px 20px;
        }

        .ai-welcome {
            text-align: center;
            margin: 30px 0 24px;
        }

        .ai-welcome-icon {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .ai-welcome h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .ai-welcome p {
            margin: 0 auto;
            max-width: 600px;
            opacity: 0.7;
            line-height: 1.5;
        }

        .ai-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0 20px;
        }

        .ai-message {
            display: flex;
            margin-bottom: 18px;
        }

        .ai-message.user {
            justify-content: flex-end;
        }

        .ai-message-bubble {
            max-width: min(78%, 700px);
            padding: 12px 15px;
            border-radius: 16px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .ai-message.user .ai-message-bubble {
            background: #38bdf8;
            color: white;
            border-bottom-right-radius: 5px;
        }

        .ai-message.assistant .ai-message-bubble {
            background: rgba(128, 128, 128, 0.12);
            border-bottom-left-radius: 5px;
        }

        .ai-typing {
            display: none;
            margin-bottom: 18px;
        }

        .ai-typing-bubble {
            display: inline-flex;
            gap: 4px;
            padding: 13px 16px;
            border-radius: 16px;
            background: rgba(128, 128, 128, 0.12);
        }

        .ai-typing-bubble span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            opacity: 0.45;
            animation: aiTyping 1.2s infinite;
        }

        .ai-typing-bubble span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .ai-typing-bubble span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes aiTyping {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            30% {
                transform: translateY(-4px);
                opacity: 1;
            }

        }

        .ai-prompts {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 18px;
        }

        .ai-prompt {
            border: 1px solid rgba(128, 128, 128, 0.25);
            background: transparent;
            color: inherit;
            border-radius: 20px;
            padding: 9px 13px;
            cursor: pointer;
            font-size: 13px;
        }

        .ai-prompt:hover {
            border-color: #38bdf8;
        }

        .ai-input-area {
            border: 1px solid rgba(128, 128, 128, 0.3);
            border-radius: 18px;
            padding: 9px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background: rgba(128, 128, 128, 0.06);
        }

        .ai-input {
            flex: 1;
            resize: none;
            border: none;
            outline: none;
            background: transparent;
            color: inherit;
            font: inherit;
            padding: 9px 8px;
            min-height: 42px;
            max-height: 130px;
        }

        .ai-send {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 12px;
            background: #38bdf8;
            color: white;
            cursor: pointer;
            font-size: 18px;
            flex-shrink: 0;
        }

        .ai-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .ai-disclaimer {
            text-align: center;
            font-size: 11px;
            opacity: 0.5;
            margin-top: 8px;
        }

        @media (max-width: 600px) {

            .ai-header {
                height: 58px;
                padding: 0 14px;
            }

            .ai-main {
                padding: 12px 10px 14px;
            }

            .ai-welcome {
                margin: 20px 0 18px;
            }

            .ai-welcome h1 {
                font-size: 24px;
            }

            .ai-welcome p {
                font-size: 14px;
            }

            .ai-message-bubble {
                max-width: 88%;
            }

            .ai-prompts {
                justify-content: flex-start;
                overflow-x: auto;
                flex-wrap: nowrap;
                padding-bottom: 4px;
            }

            .ai-prompt {
                white-space: nowrap;
            }

        }

    </style>

</head>

<body>

<div class="ai-page">

    <header class="ai-header">

        <div class="ai-brand">

            <div class="ai-brand-icon">
                🤖
            </div>

            <span>
                UniCamplink AI
            </span>

        </div>

        <a
            href="{{ url_for('dashboard') }}"
            class="ai-back"
        >
            ← Dashboard
        </a>

    </header>


    <main class="ai-main">

        <section
            class="ai-welcome"
            id="aiWelcome"
        >

            <div class="ai-welcome-icon">
                🤖
            </div>

            <h1>
                Ask UniCamplink AI
            </h1>

            <p>
                Get help with your studies, programming,
                opportunities and questions around campus life.
            </p>

        </section>


        <div
            class="ai-messages"
            id="aiMessages"
        >
        </div>


        <div
            class="ai-typing"
            id="aiTyping"
        >

            <div class="ai-typing-bubble">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>


        <div
            class="ai-prompts"
            id="aiPrompts"
        >

            <button
                type="button"
                class="ai-prompt"
                data-prompt="What opportunities are available on UniCamplink?"
            >
                🎯 Opportunities
            </button>

            <button
                type="button"
                class="ai-prompt"
                data-prompt="Help me understand SDLC."
            >
                💻 Explain SDLC
            </button>

            <button
                type="button"
                class="ai-prompt"
                data-prompt="Give me some programming project ideas for a computer engineering student."
            >
                🚀 Project Ideas
            </button>

            <button
                type="button"
                class="ai-prompt"
                data-prompt="How can I make better use of UniCamplink?"
            >
                🎓 Use UniCamplink
            </button>

        </div>


        <form
            class="ai-input-area"
            id="aiForm"
        >

            <textarea
                id="aiInput"
                class="ai-input"
                placeholder="Ask UniCamplink AI..."
                rows="1"
                maxlength="4000"
                autocomplete="off"
            ></textarea>

            <button
                type="submit"
                class="ai-send"
                id="aiSend"
                aria-label="Send message"
            >
                ➤
            </button>

        </form>

        <div class="ai-disclaimer">
            UniCamplink AI can make mistakes. Verify important information.
        </div>

    </main>

</div>


<script>

    const aiForm = document.getElementById("aiForm");
    const aiInput = document.getElementById("aiInput");
    const aiSend = document.getElementById("aiSend");
    const aiMessages = document.getElementById("aiMessages");
    const aiTyping = document.getElementById("aiTyping");
    const aiWelcome = document.getElementById("aiWelcome");
    const aiPrompts = document.getElementById("aiPrompts");

    const csrfToken = document
        .querySelector('meta[name="csrf-token"]')
        .content;

    let conversation = [];

    let isSending = false;


    function scrollToBottom() {

        aiMessages.scrollTop = aiMessages.scrollHeight;

    }


    function addMessage(role, text) {

        const wrapper = document.createElement("div");

        wrapper.className =
            "ai-message " +
            (role === "user" ? "user" : "assistant");


        const bubble = document.createElement("div");

        bubble.className = "ai-message-bubble";

        bubble.textContent = text;


        wrapper.appendChild(bubble);

               aiMessages.appendChild(wrapper);

        scrollToBottom();

        return bubble;
    }


    function setLoading(loading) {

        isSending = loading;

        aiSend.disabled = loading;

        aiInput.disabled = loading;

        aiTyping.style.display =
            loading ? "block" : "none";

        if (loading) {
            scrollToBottom();
        }

    }


    async function sendMessage(message) {

    message = message.trim();

    if (!message || isSending) {
        return;
    }


    addMessage(
        "user",
        message
    );

    aiInput.value = "";

    aiWelcome.style.display = "none";

    aiPrompts.style.display = "none";


    const previousConversation = [
        ...conversation
    ];


    setLoading(true);


    let assistantText = "";

    let assistantMessage = null;


    try {

        const response = await fetch(
            "/api/ai/chat/stream",
            {
                method: "POST",

                credentials: "same-origin",

                headers: {
                    "Content-Type":
                        "application/json",

                    "X-CSRFToken":
                        csrfToken,

                    "Accept":
                        "text/event-stream"
                },

                body: JSON.stringify({
                    message: message,

                    conversation:
                        previousConversation
                })
            }
        );


        if (!response.ok) {

            let errorMessage =
                "Unable to get a response from UniCamplink AI.";

            try {

                const errorData =
                    await response.json();

                if (errorData.error) {
                    errorMessage =
                        errorData.error;
                }

            } catch (parseError) {
                // Keep the default error message.
            }

            throw new Error(
                errorMessage
            );
        }


        if (!response.body) {

            throw new Error(
                "Streaming is not supported by this response."
            );
        }


        /*
         * Create the assistant message
         * immediately so text can appear
         * progressively.
         */
        assistantMessage =
            addMessage(
                "assistant",
                ""
            );


        const reader =
            response.body.getReader();

        const decoder =
            new TextDecoder();


        let buffer = "";

        let finished = false;


        while (!finished) {

            const {
                value,
                done
            } = await reader.read();


            if (done) {
                break;
            }


            buffer += decoder.decode(
                value,
                {
                    stream: true
                }
            );


            const events =
                buffer.split("\n\n");


            buffer =
                events.pop() || "";


            for (
                const event of events
            ) {

                const lines =
                    event.split("\n");


                const dataLine =
                    lines.find(
                        line =>
                            line.startsWith(
                                "data: "
                            )
                    );


                if (!dataLine) {
                    continue;
                }


                const payload =
                    JSON.parse(
                        dataLine.slice(6)
                    );


                if (
                    payload.type ===
                    "text"
                ) {

                    assistantText +=
                        payload.text;


                    /*
                     * addMessage() in your
                     * current page returns
                     * the message element.
                     */
                    if (
                        assistantMessage
                    ) {

                        assistantMessage.textContent =
                            assistantText;
                    }


                    aiMessages.scrollTop =
                         aiMessages.scrollHeight;
                }


                if (
                    payload.type ===
                    "done"
                ) {

                    finished = true;

                    break;
                }


                if (
                    payload.type ===
                    "error"
                ) {

                    throw new Error(
                        payload.error ||
                        "UniCamplink AI encountered an error."
                    );
                }
            }
        }


        /*
         * Make sure any final bytes
         * remaining in the decoder are
         * processed.
         */
        const remaining =
            decoder.decode();


        if (remaining) {

            buffer += remaining;
        }


        if (!assistantText.trim()) {

            throw new Error(
                "UniCamplink AI returned an empty response."
            );
        }


        conversation.push({
            role: "user",
            content: message
        });


        conversation.push({
            role: "assistant",
            content: assistantText
        });


    } catch (error) {

        /*
         * If the assistant bubble was
         * created but streaming failed,
         * remove its incomplete content
         * instead of leaving a blank bubble.
         */
        if (
            assistantMessage &&
            !assistantText.trim()
        ) {

            assistantMessage.remove();
        }


        addMessage(
            "assistant",
            error.message ||
            "Sorry, I couldn't process that request. Please try again."
        );


        console.error(
            "UniCamplink AI streaming error:",
            error
        );


    } finally {

        setLoading(false);

        aiInput.focus();

    }

}


    aiForm.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            sendMessage(aiInput.value);

        }
    );


    aiInput.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                aiForm.requestSubmit();

            }

        }
    );


    aiInput.addEventListener(
        "input",
        function() {

            this.style.height = "auto";

            this.style.height =
                Math.min(
                    this.scrollHeight,
                    130
                ) + "px";

        }
    );


    document
        .querySelectorAll(".ai-prompt")
        .forEach(function(button) {

            button.addEventListener(
                "click",
                function() {

                    sendMessage(
                        button.dataset.prompt
                    );

                }
            );

        });


    aiInput.focus();

</script>

</body>

</html>
